# Build app máy tính Windows (Tauri) — CHỈ CHO ADMIN: tải file cài ở trang Actions > Artifacts (không đưa lên web)
name: Build PC app

on:
  push:
    branches: [main]
    paths:
      - "pc-app/**"
      - ".github/workflows/pc-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pc-app/src-tauri -> target"

      - name: Check files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse pc-app | Where-Object { $_.FullName -notmatch 'node_modules|target' } | Select-Object -ExpandProperty FullName
          foreach ($f in "pc-app/package.json","pc-app/icon.png","pc-app/dist/index.html","pc-app/src-tauri/Cargo.toml","pc-app/src-tauri/build.rs","pc-app/src-tauri/tauri.conf.json","pc-app/src-tauri/src/main.rs") {
            if (-not (Test-Path $f)) { Write-Host "::error::THIEU FILE: $f"; exit 1 } }
          node --version; npm --version; cargo --version

      - name: Install Tauri CLI
        working-directory: pc-app
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          if (-not (Test-Path node_modules/.bin/tauri.cmd)) { npm install --no-audit --no-fund --save-dev "@tauri-apps/cli@^2" "@tauri-apps/cli-win32-x64-msvc@^2" }
          npm run tauri -- --version

      - name: Make icons
        working-directory: pc-app
        shell: pwsh
        run: npm run tauri -- icon icon.png

      - name: Build installer
        working-directory: pc-app
        shell: pwsh
        run: |
          Set-Content -Encoding ascii ver.json '{"version":"1.${{ github.run_number }}.0"}'
          npm run tauri -- build --bundles nsis --config ver.json

      - name: Find installer
        shell: bash
        run: |
          f=$(ls pc-app/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "Installer: $f"
          mkdir -p out && cp "$f" out/BlueRoblox-Admin-PC-Setup.exe

      # CHỈ DÀNH CHO ADMIN: file cài KHÔNG đưa lên web — tải ở trang Actions (mục Artifacts), cần đăng nhập GitHub
      - uses: actions/upload-artifact@v4
        with:
          name: BlueRoblox-Admin-PC-Setup
          path: out/BlueRoblox-Admin-PC-Setup.exe
          retention-days: 90
