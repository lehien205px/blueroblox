<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#060a1c">
<title>Điều khiển máy – BLUEROBLOX</title>
<link rel="icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#060a1c; --panel:#0e1638; --panel2:#16224f; --line:rgba(143,208,255,.14); --line2:rgba(143,208,255,.28);
  --fg:#eef3ff; --muted:#97a5cf; --blue:#3d7bff; --sky:#8fd0ff; --ok:#3ce0b0; --wait:#ffc861; --bad:#ff6b81;
  --font:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ring:var(--wait); --top:56px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0d1a4a 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
a{color:var(--sky)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:18px;height:18px}

/* ---------- thanh trên ---------- */
.top{position:relative;z-index:20;height:var(--top);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(6,10,28,.72);backdrop-filter:blur(8px)}
.home{display:flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.home:hover{color:var(--fg)}
.devwrap{position:relative;min-width:0}
.dev{min-width:0;max-width:240px;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);color:var(--fg);border-radius:10px;padding:7px 10px;font:inherit;font-weight:600}
.dev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev i{width:8px;height:8px;border-radius:50%;background:var(--wait);flex:none}
.dev i.ok{background:var(--ok)} .dev i.bad{background:var(--bad)}
.dev svg{flex:none;opacity:.7}
.devmenu{position:absolute;left:0;top:calc(100% + 8px);z-index:55;width:min(500px,calc(100vw - 16px));max-height:min(70dvh,560px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 50px -20px #000}
.devmenu[hidden]{display:none}
.dm-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dm-h b{flex:1}
.dm-l{overflow:auto;padding:6px}
.dm-r{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;padding:10px 10px;border-radius:12px}
.dm-r:hover{background:rgba(143,208,255,.06)}
.dm-r.cur{background:rgba(61,123,255,.14)}
.dm-r input{width:16px;height:16px;accent-color:var(--blue)}
.dm-r .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.dm-r .nm i{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
.dm-r .nm i.ok{background:var(--ok)} .dm-r .nm i.bad{background:var(--bad)}
.dm-r small{grid-column:2;color:var(--muted);font-size:12px}
.dm-r .btn{grid-row:1/3;grid-column:3}
.dm-r .nm b{font-weight:600}
.dm-r .acts2{grid-row:1/4;grid-column:3;display:flex;flex-direction:column;gap:5px}
.dm-r .info2{grid-column:2;font-size:12px;color:var(--muted)}
.dm-r .exp2{grid-column:2;font-size:12.5px;font-weight:600}
.lv-ok{color:var(--ok)} .lv-warn{color:#ffc861} .lv-bad{color:var(--bad)}
.dm-r.warn{box-shadow:inset 3px 0 0 #ffc861} .dm-r.bad{box-shadow:inset 3px 0 0 var(--bad)}
.expbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,200,97,.1);border-bottom:1px solid rgba(255,200,97,.35);color:#ffe7b8;font-size:13px}
.expbar.bad{background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.45);color:#ffd4db}
.expbar[hidden]{display:none}
.fitbar{background:rgba(61,123,255,.1);border-color:rgba(143,208,255,.35);color:#d7e6ff}
.expbar span{flex:1;min-width:0}
.rnsum{display:grid;gap:6px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.rnsum div{display:flex;justify-content:space-between;gap:10px}
.rnsum b{font-size:16px}
.dm-f{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.dm-f span{flex:1;color:var(--muted);font-size:12.5px}
.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.meta b{color:var(--fg);font-weight:600}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:6px 9px;color:#d7e1ff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{background:var(--panel2)}
.seg button.on{background:rgba(61,123,255,.2);color:#fff}
.seg span{padding:0 4px;font:12px var(--mono);color:var(--muted);min-width:64px;text-align:center}
.right{margin-left:auto;display:flex;align-items:center;gap:10px}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ring);box-shadow:0 0 0 4px color-mix(in srgb,var(--ring) 22%,transparent)}
.adminlink{font-size:12.5px;white-space:nowrap}

/* ---------- 1 máy ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:12px 16px;gap:14px}
.viewport{flex:0 1 auto;min-width:0;min-height:0;max-width:100%;max-height:100%;overflow:auto;display:grid;place-items:center;scrollbar-width:thin}
.frame{position:relative;border-radius:24px;padding:7px;background:#02040d;border:1px solid var(--line2);flex:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 36px -8px color-mix(in srgb,var(--ring) 55%,transparent),0 30px 60px -30px #000;transition:box-shadow .5s}
.frame iframe{display:block;border:0;border-radius:18px;background:#000;width:100%;height:100%}
.veil{position:absolute;inset:7px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:22px;background:#040816;color:var(--muted)}
.veil[hidden]{display:none}
.veil b{color:var(--fg);font-size:16px}
.veil .btn{margin-top:4px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--sky);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info{font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.side{flex:none;display:flex;flex-direction:column;gap:10px;min-height:0;max-height:100%}
.tools{width:164px;flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:2px;padding:10px 8px;border-radius:18px;background:rgba(14,22,56,.78);border:1px solid var(--line)}
.tools h6{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--muted);padding:8px 6px 3px}
.tools h6:first-child{padding-top:2px}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;color:#d7e1ff;font-size:11.5px;line-height:1.2;text-align:center;transition:background .15s,color .15s}
.tb:hover{background:var(--panel2);color:#fff}
.tb:active{transform:scale(.96)}
.tb.on{color:var(--sky);background:rgba(61,123,255,.16)}
.tb.danger:hover{color:var(--bad)}
.tb[disabled]{opacity:.35;pointer-events:none}

/* ---------- nhiều máy ---------- */
.grid{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;display:none;align-content:start;justify-content:center;gap:14px}
body.multi .stage{display:none}
body.multi .grid{display:grid}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.th{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
.th i{width:7px;height:7px;border-radius:50%;background:var(--wait);flex:none}
.th i.ok{background:var(--ok)} .th i.bad{background:var(--bad)}
.th span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.th small{color:var(--muted);font-weight:500;font:11px var(--mono)}
.tf{position:relative;border-radius:16px;padding:4px;background:#02040d;border:1px solid var(--line2)}
.tf iframe{display:block;border:0;border-radius:12px;background:#000;width:100%;height:100%}
.tf .veil{inset:4px;border-radius:12px;padding:10px;font-size:12px}
.tf .veil b{font-size:13px}
.tbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tbar button{padding:6px 2px;border-radius:9px;border:1px solid var(--line);color:#d7e1ff;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tbar button:hover{background:var(--panel2)}
.gempty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}

/* ---------- thanh dưới (điện thoại) ---------- */
.mbar,.sheetbg{display:none}

/* kéo thả */
.drop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(3,6,18,.78);backdrop-filter:blur(3px)}
.drop.on{display:flex}
.drop div{border:2px dashed var(--sky);border-radius:22px;padding:42px 56px;text-align:center;background:rgba(61,123,255,.08)}
.drop b{display:block;font-size:20px;margin-bottom:6px}
.drop span{color:var(--muted)}
body.dragging iframe{pointer-events:none}

/* khay tải lên */
.tray{position:fixed;right:16px;bottom:16px;z-index:30;width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.ti{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;box-shadow:0 14px 30px -14px #000}
.ti .r{display:flex;gap:8px;align-items:baseline}
.ti .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ti .s{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.ti .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.ti.ok .m{color:var(--ok)} .ti.err .m{color:var(--bad)}
.ti .bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.ti .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.ti.ok .bar i{background:var(--ok)} .ti.err .bar i{background:var(--bad)}
.ti .x{color:var(--muted);font-size:18px;line-height:1;padding:0 2px}

/* hộp thoại */
.dlg{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,18,.7)}
.dlg[hidden]{display:none}
.box{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px}
.box h3{font-size:17px;margin-bottom:6px}
.box p{color:var(--muted);font-size:13px;margin-bottom:12px}
.in{width:100%;background:#070c22;border:1px solid var(--line2);color:var(--fg);border-radius:11px;padding:11px 12px;font:inherit}
textarea.in{min-height:110px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{padding:10px 16px;border-radius:11px;background:var(--blue);color:#fff;font-weight:600}
.btn.gh{background:transparent;border:1px solid var(--line2);color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.red{background:transparent;border:1px solid rgba(255,107,129,.45);color:var(--bad)}
.apps{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.app{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.app span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12.5px var(--mono)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chips.c2{grid-template-columns:repeat(2,1fr)}
.chips button{padding:9px 4px;border-radius:10px;border:1px solid var(--line2);background:#070c22;font-weight:600;font-size:13px;line-height:1.25}
.chips button small{display:block;font:10.5px var(--mono);color:var(--muted);font-weight:500}
.chips.c3 button small,.chips.c2 button small{font-family:var(--font);font-size:11px}
.chips button.on{border-color:var(--sky);background:rgba(61,123,255,.16);color:#fff}
.lbl{display:block;font-size:12.5px;color:var(--muted);margin-top:10px}
.shot{display:block;max-width:100%;max-height:60dvh;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:0 14px 30px -14px #000;max-width:calc(100vw - 32px)}
.toast.bad{border-color:rgba(255,107,129,.5);color:#ffd4db}
.toast[hidden]{display:none}
.clipbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:58;display:flex;align-items:center;gap:10px;
  width:min(520px,calc(100vw - 24px));padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 14px 30px -14px #000}
.clipbar[hidden]{display:none}
.clipbar .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.clipbar .ct small{color:var(--muted);font-size:12px}
.clipbar .ct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.clipbar .x{all:unset;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px}
.clipbar .x:focus-visible{outline:2px solid var(--sky)}
.cliptxt{width:100%;min-height:110px;resize:vertical}

/* ---------- màn nhỏ ---------- */
@media (max-width:860px){
  :root{--top:50px}
  .top{gap:6px;padding:0 8px}
  .home span,.meta .spec,.adminlink,.state span,#zoomseg,.info{display:none}
  #viewseg span{display:none!important}
  #viewseg button{padding:6px 8px}
  .dev{max-width:46vw;padding:6px 8px;font-size:13px}
  .devmenu{position:fixed;left:8px;right:8px;top:calc(var(--top) + 6px);width:auto}
  .meta{font-size:12px}
  .stage{padding:6px 6px calc(64px + env(safe-area-inset-bottom))}
  .frame{border-radius:16px;padding:3px}
  .frame iframe,.veil{border-radius:13px}
  .veil{inset:3px}
  .info{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:45;transform:translateY(105%);transition:transform .25s}
  .side.open{transform:none}
  .tools{width:auto;max-height:70dvh;border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border-color:var(--line2)}
  .tools h6{text-align:left;padding:8px 4px 2px}
  .tb{padding:10px 2px;font-size:12px}
  .sheetbg.open{display:block;position:fixed;inset:0;z-index:44;background:rgba(3,6,18,.55)}
  .mbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(8,13,36,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
  .mbar .tb{font-size:11px;padding:6px 2px}
  body.multi .mbar{display:none}
  .th small,.th .btn{display:none}
  .tbar span{display:none}
  .tbar button{padding:8px 2px;font-size:15px}
  .grid{padding:10px 8px 18px;gap:10px}
  .tray{bottom:calc(72px + env(safe-area-inset-bottom));right:8px;width:calc(100vw - 16px)}
}
body.focus .top,body.focus .side,body.focus .mbar{display:none}
body.focus .stage{padding:0}
body.focus .frame{border-radius:0;padding:0;border:0}
body.focus .frame iframe,body.focus .frame .veil{border-radius:0;inset:0}
body.focus .info{display:none}
.exitfocus{position:fixed;top:10px;right:10px;z-index:36;display:none;padding:8px 12px;border-radius:10px;background:rgba(14,22,56,.85);border:1px solid var(--line2);font-size:13px}
body.focus .exitfocus{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="/" title="Về cửa hàng"><svg class="ic sm" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Cửa hàng</span></a>
  <div class="devwrap">
    <button class="dev" id="devbtn" type="button" aria-haspopup="true" aria-expanded="false" title="Chọn máy"><i id="devdot"></i><span id="devname">Máy của tôi</span><svg class="ic sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="devmenu" id="devmenu" hidden role="menu">
      <div class="dm-h"><b id="dm-title">Máy của bạn</b><button class="btn sm" type="button" id="dm-all">⊞ Mở tất cả</button></div>
      <div class="dm-l" id="dm-list"></div>
      <div class="dm-f"><span id="dm-hint">Tích chọn để mở nhiều máy cùng lúc</span><button class="btn sm gh" type="button" id="dm-sel" disabled>Mở máy đã chọn</button></div>
    </div>
  </div>
  <div class="seg" id="viewseg" role="group" aria-label="Kiểu xem">
    <button id="v-one" class="on" title="Xem 1 máy"><svg class="ic sm" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/></svg><span style="min-width:0;padding:0;color:inherit;font:inherit">1 máy</span></button>
    <button id="v-multi" title="Xem nhiều máy cùng lúc"><svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="8" rx="1.5"/><rect x="3" y="13" width="7" height="8" rx="1.5"/><rect x="14" y="13" width="7" height="8" rx="1.5"/></svg><span style="min-width:0;padding:0;color:inherit;font:inherit" id="multin">Nhiều máy</span></button>
  </div>
  <div class="meta"><span class="spec" id="spec"></span><span id="left"></span></div>
  <div class="right">
    <span class="info" id="info" title="Độ phân giải máy · độ nét hình đang gửi · kích thước hiển thị · tốc độ mạng"></span>
    <div class="seg" id="zoomseg" role="group" aria-label="Phóng to">
      <button id="z-out" title="Thu nhỏ (Ctrl −)" aria-label="Thu nhỏ">−</button><span id="z-val">100%</span><button id="z-in" title="Phóng to (Ctrl +)" aria-label="Phóng to">+</button><button id="z-fit" title="Vừa khung (Ctrl 0)">Vừa</button>
    </div>
    <a class="adminlink" id="adminlink" href="https://phone.blueroblox.shop/" target="_blank" rel="noopener" hidden>Tất cả máy (admin)</a>
    <span class="state" id="state"><i></i><span id="statetxt">Đang kết nối…</span></span>
  </div>
</header>

<div class="expbar fitbar" id="fitbar" hidden><span id="fittxt"></span><button class="btn sm" type="button" id="fitgo">📐 Khớp ngay</button><button class="btn sm gh" type="button" id="fitno">Để sau</button></div>
<div class="expbar" id="expbar" hidden><span id="exptxt"></span><button class="btn sm" type="button" id="expgo">Xem &amp; gia hạn</button></div>
<main class="stage" id="stage">
  <div class="viewport" id="viewport">
    <div class="frame" id="frame">
      <iframe id="scr" title="Màn hình điện thoại" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
      <div class="veil" id="veil"><div class="spin"></div><b id="veilt">Đang mở máy…</b><span id="veild"></span></div>
    </div>
  </div>
  <div class="side" id="side">

    const el = document.createElement("div"); el.className = "tile";
    el.innerHTML = `<div class="th"><i></i><span>${esc(p.name)}</span><small>${esc(p.res || "")}</small>
        <button class="btn sm gh" data-big="${p.id}" title="Mở lớn máy này">Mở lớn</button></div>
      <div class="tf"><iframe title="${esc(p.name)}" allow="autoplay; clipboard-read; clipboard-write"></iframe>
        <div class="veil"><div class="spin"></div><b>Đang mở…</b><span></span></div></div>
      <div class="tbar"><button data-tkey="4" data-id="${p.id}">↩<span>Quay lại</span></button><button data-tkey="3" data-id="${p.id}">○<span>Màn chính</span></button>

      connecting(n) { dot.className = ""; veilOn(v, true, n ? "Đang nối lại…" : "Đang mở…", ""); },
      ok() { dot.className = "ok"; veilOn(v, false); },

      size() { layoutGrid(); },

function layoutGrid() {
  const n = tiles.size; if (!n) return;
  const g = $("grid"), W = g.clientWidth - 32, H = g.clientHeight - 32, gap = 14, extra = 96;   // tiêu đề + nút
  let best = { cols: 1, w: 120 };
  for (let cols = 1; cols <= Math.min(n, 8); cols++) {
    const rows = Math.ceil(n / cols), tw = (W - gap * (cols - 1)) / cols, th = (H - gap * (rows - 1)) / rows - extra;
    const w = Math.min(tw, th * 9 / 19.5);
    if (w > best.w) best = { cols, w };
  }
  const minW = small() ? (innerWidth - 36) / 2 : 160, w = Math.max(minW, Math.floor(best.w)), cols = small() ? 2 : best.cols;
  g.style.gridTemplateColumns = `repeat(${cols}, ${w}px)`;
  for (const t of tiles.values()) {
    const s = t.conn.size || resOf(t.p);
    t.el.querySelector(".tf").style.height = Math.round(w * s[1] / s[0]) + "px";
  }
}

function trayItem(name, size) {
  const el = document.createElement("div"); el.className = "ti";
  el.innerHTML = `<div class="r"><span class="n"></span><span class="s"></span><button class="x" aria-label="Ẩn">×</button></div><div class="m">Đang chờ…</div><div class="bar"><i></i></div>`;
  el.querySelector(".n").textContent = name; el.querySelector(".s").textContent = size ? mb(size) : "";
  el.querySelector(".x").onclick = () => el.remove();
  $("tray").prepend(el);
  return {
    el, msg(t) { el.querySelector(".m").textContent = t; },
    pct(p) { el.querySelector(".bar i").style.width = Math.round(p * 100) + "%"; },
    done(t) { el.classList.add("ok"); this.pct(1); this.msg(t); setTimeout(() => el.remove(), 9000); },
    fail(t) { el.classList.add("err"); this.pct(1); this.msg(t); },
  };
}
async function pollJob(jid, item) {
  const t0 = Date.now();
  while (Date.now() - t0 < 40 * 60 * 1000) {
    await sleep(1500);
    try {
      const j = await api("job?id=" + jid);
      if (j.state === "done") { item.done(j.msg); return true; }
      if (j.state === "error") { item.fail(j.msg); return false; }
      item.msg(j.msg); item.el.querySelector(".bar i").style.width = "100%"; item.el.querySelector(".bar i").style.opacity = ".45";
    } catch (e) { if (e.status === 404) { item.fail("Không theo dõi được (server vừa khởi động lại)."); return false; } }
  }
  item.fail("Quá lâu chưa xong — kiểm tra lại trên máy."); return false;
}
const queue = []; let busyUp = false;
function addFiles(list) {
  if (!cur || cur.status !== "active") { toast("Máy chưa chạy, chưa tải file được.", 1); return; }
  for (const f of list) {
    if (!f.size) { toast(f.name + ": file rỗng.", 1); continue; }
    if (f.size > 4 * 1073741824) { toast(f.name + ": lớn hơn 4GB.", 1); continue; }
    const it = trayItem(f.name, f.size); it.msg(/\.apk$/i.test(f.name) ? "Chờ tải lên — sẽ tự cài" : "Chờ tải lên");
    queue.push({ f, it, pid: cur.id });
  }
  runQueue();
}
async function runQueue() {
  if (busyUp) return; busyUp = true;
  while (queue.length) { const { f, it, pid } = queue.shift(); try { await upOne(f, it, pid); } catch (e) { it.fail(e.message || "Tải lên lỗi."); } }
  busyUp = false;
}
async function upOne(f, it, pid) {
  const id = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 24).toLowerCase();
  let off = 0; const t0 = Date.now();
  while (off < f.size) {
    let j, tries = 0;
    for (;;) {
      try {
        j = await api(`${pid}/upload?id=${id}&name=${encodeURIComponent(f.name)}&total=${f.size}&off=${off}`,
          { method: "POST", body: f.slice(off, off + CHUNK), headers: { "Content-Type": "application/octet-stream" } });
        break;
      } catch (e) {
        if (e.status === 409 && e.data && e.data.size != null) { j = { size: e.data.size }; break; }
        if (e.status && e.status < 500 && e.status !== 408) throw e;
        if (++tries > 5) throw new Error("Mạng chập chờn, tải lên thất bại. Thử lại sau.");
        it.msg("Mạng chập chờn, đang thử lại…"); await sleep(1500 * tries);
      }
    }
    off = j.size; it.pct(off / f.size * .96);
    it.msg(`Đang tải lên ${Math.round(off / f.size * 100)}% · ${mb(off / Math.max(1, (Date.now() - t0) / 1000))}/s`);
    if (j.job) { it.msg(/\.apk$/i.test(f.name) ? "Đang cài ứng dụng…" : "Đang chép vào máy…"); await pollJob(j.job, it); return; }
  }
}

  if (fs.length && $("dlg").hidden) { addFiles(fs); return; }
  const el = document.activeElement, typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  const t = e.clipboardData && e.clipboardData.getData("text/plain");
  if (t && !typing && $("dlg").hidden && cur && main.ok) { e.preventDefault(); pasteToPhone(t); }
});

/* ---------- khởi động trang ---------- */
(async function init() {
  setTools(false); syncMobile();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { setState("bad", "Chưa đăng nhập"); veil(true, "Bạn chưa đăng nhập", '<a href="/">Về cửa hàng để đăng nhập</a>, rồi bấm “Điều khiển” trên máy của bạn.', false); return; }
  token = session.access_token; me = session.user;
  sb.auth.onAuthStateChange((_e, s) => { if (s) token = s.access_token; });
  try { const s = await api("session", { method: "POST", json: {} }); if (s.admin) $("adminlink").hidden = false; }
  catch (e) { setState("bad", "Không kết nối được server"); veil(true, "Không kết nối được máy chủ điện thoại", esc(e.message) + '<br><a href="">Tải lại trang</a>', false); return; }
  const p = await loadPhones(); loadBilling().catch(() => {});
  if (store.get("cp_view") === "multi" && phones.filter(x => x.status === "active").length > 1 && !new URLSearchParams(location.search).get("id")) { cur = p; renderHead(); setView("multi"); }
  else openPhone(p);
})();
</script>
