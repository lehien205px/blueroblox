plugins {
    id 'com.android.application'
}

// Phiên bản app: tự tăng theo số lần GitHub build (APP_VERSION_CODE do workflow truyền vào)
def vCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer
def ks = System.getenv("KEYSTORE_FILE")

android {
    namespace 'shop.blueroblox.app'
    compileSdk 34

    defaultConfig {
        applicationId "shop.blueroblox.app"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1." + vCode
    }

    signingConfigs {
        release {
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "blueroblox"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (ks && new File(ks).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
