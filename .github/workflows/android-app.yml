# Build Android app BlueRoblox Cloud -> blueroblox-site/download/blueroblox-cloud.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Missing secret ANDROID_KEYSTORE_B64 - using a temporary key"
          fi

      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android-app assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Copy APK to website
        run: |
          mkdir -p blueroblox-site/download
          cp android-app/app/build/outputs/apk/release/app-release.apk blueroblox-site/download/blueroblox-cloud.apk
          SIZE=$(stat -c %s blueroblox-site/download/blueroblox-cloud.apk)
          printf '{"version":"1.%s","code":%s,"size":%s,"date":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > blueroblox-site/download/app.json

      - uses: actions/upload-artifact@v4
        with:
          name: blueroblox-cloud-apk
          path: blueroblox-site/download/blueroblox-cloud.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blueroblox-cloud-aab-chplay
          path: android-app/app/build/outputs/bundle/release/app-release.aab

      - name: Save APK to repo (Vercel publishes it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueroblox-site/download
          git commit -m "App Android v1.${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
