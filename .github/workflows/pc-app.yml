# Build app máy tính Windows (Tauri) — CHỈ CHO ADMIN: tải file cài ở trang Actions > Artifacts (không đưa lên web)
name: Build PC app

on:
  push:
    branches: [main]
    paths:
      - "pc-app/**"
      - ".github/workflows/pc-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pc-app/src-tauri -> target"

      - name: Build installer
        working-directory: pc-app
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx tauri icon icon.png
          npx tauri build --bundles nsis --config "{\"version\":\"1.${{ github.run_number }}.0\"}"

      - name: Find installer
        shell: bash
        run: |
          f=$(ls pc-app/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "Installer: $f"
          mkdir -p out && cp "$f" out/BlueRoblox-Admin-PC-Setup.exe

      # CHỈ DÀNH CHO ADMIN: file cài KHÔNG đưa lên web — tải ở trang Actions (mục Artifacts), cần đăng nhập GitHub
      - uses: actions/upload-artifact@v4
        with:
          name: BlueRoblox-Admin-PC-Setup
          path: out/BlueRoblox-Admin-PC-Setup.exe
          retention-days: 90
