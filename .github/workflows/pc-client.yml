# Build app PC cho khách (Python → exe) → GitHub Release "pc-latest" → web tải ở /download/CloudBluePC.zip
name: Build PC client

on:
  push:
    branches: [main]
    paths:
      - "pc-client/**"
      - ".github/workflows/pc-client.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-client
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        shell: pwsh
        working-directory: pc-client
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller av pygame-ce numpy pillow
          python -m py_compile bluepc.py brstream.py
          $icon = @()
          if (Test-Path icon.png) { $icon = @("--icon", "icon.png", "--add-data", "icon.png;.") }
          python -m PyInstaller --noconfirm --clean --windowed --name CloudBluePC --collect-submodules av @icon bluepc.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # thử bản exe: đủ thư viện giải mã + cửa sổ chưa (thiếu → báo lỗi, KHÔNG đưa bản hỏng cho khách)
          $st = Join-Path $PWD "selftest.txt"
          Start-Process -FilePath dist/CloudBluePC/CloudBluePC.exe -ArgumentList "--selftest", "`"$st`"" -Wait -NoNewWindow
          if (-not (Test-Path $st)) { Write-Error "exe không chạy được"; exit 1 }
          Get-Content $st
          if ((Get-Content $st -TotalCount 1) -ne "OK") { exit 1 }
          Compress-Archive -Force -Path dist/CloudBluePC -DestinationPath dist/CloudBluePC.zip
          Get-Item dist/CloudBluePC.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CloudBluePC
          path: pc-client/dist/CloudBluePC.zip

      - name: Publish (GitHub Release pc-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="App máy tính cho khách. Tải CloudBluePC.zip, giải nén, chạy CloudBluePC.exe."
          gh release view pc-latest >/dev/null 2>&1 || gh release create pc-latest --title "CloudBlue PC (bản mới nhất)" --notes "$NOTES" --latest=false
          gh release upload pc-latest pc-client/dist/CloudBluePC.zip --clobber
          gh release edit pc-latest --title "CloudBlue PC (bản mới nhất)" --notes "$NOTES" || true
          # bản tên cũ không còn được cập nhật → xoá cho khỏi tải nhầm (link cũ trên web đã chuyển sang tên mới)
          gh release delete-asset pc-latest BlueRobloxPC.zip --yes 2>/dev/null || true
