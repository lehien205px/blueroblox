plugins {
    id 'com.android.application'
}

// Phiên bản app: tự tăng theo số lần GitHub build (APP_VERSION_CODE do workflow truyền vào)
def vCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer
def ksPath = System.getenv("KEYSTORE_FILE")
def hasKey = ksPath != null && new File(ksPath).exists()
def ksPass = System.getenv("KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("KEY_ALIAS") ?: "blueroblox"
def keyPass = System.getenv("KEY_PASSWORD") ?: ksPass

android {
    namespace = 'shop.blueroblox.app'
    compileSdk = 36

    defaultConfig {
        applicationId = "shop.blueroblox.app"
        minSdk = 24
        targetSdk = 36
        versionCode = vCode
        versionName = "1." + vCode
    }

    signingConfigs {
        release {
            if (hasKey) {
                storeFile = file(ksPath)
                storePassword = ksPass
                keyAlias = keyAliasName
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
